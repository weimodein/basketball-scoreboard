<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="home-section">
          <h1>HOME</h1>
          <h2 class="score-text" id="home-score">0</h2>
          <button class="score-btn" id="home-one-btn">+1</button>
          <button class="score-btn" id="home-two-btn">+2</button>
          <button class="score-btn" id="home-three-btn">+3</button>
        </div>

        <div class="guest-section">
          <h1>GUEST</h1>
          <h2 class="score-text" id="guest-score">0</h2>
          <button class="score-btn" id="guest-one-btn">+1</button>
          <button class="score-btn" id="guest-two-btn">+2</button>
          <button class="score-btn" id="guest-three-btn">+3</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
